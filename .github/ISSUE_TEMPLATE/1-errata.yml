name: 勘誤回報 / Erratum
description: 回報錯字、技術錯誤或過時的內容 / Report a typo, a technical error or outdated content
title: "[勘誤] "
labels: ["errata"]
body:
  - type: markdown
    attributes:
      value: |
        感謝你幫忙找出錯誤！修正技術內容時，請盡量附上官方文件，或你實際執行指令得到的結果。
        Thank you for helping us fix mistakes! For technical corrections, please include official documentation or the output you actually got.
  - type: dropdown
    id: language
    attributes:
      label: 版本 / Version
      options:
        - 繁體中文 / Traditional Chinese
        - English
        - 日本語 / Japanese
        - 한국어 / Korean
        - 多個語言 / Several languages
    validations:
      required: true
  - type: dropdown
    id: chapter
    attributes:
      label: 章節 / Chapter
      options:
        - "第 0 章 Git 全景 / Ch. 0 The Big Picture"
        - "第 1 章 準備工具 / Ch. 1 Setting Up Your Tools"
        - "第 2 章 三個區域 / Ch. 2 The Three Areas"
        - "第 3 章 Commit 的真面目 / Ch. 3 What a Commit Really Is"
        - "第 4 章 分支 / Ch. 4 Branches"
        - "第 5 章 合併與衝突 / Ch. 5 Merging and Conflicts"
        - "第 6 章 遠端儲存庫 / Ch. 6 Remote Repositories"
        - "第 7 章 Pull Request 與程式碼審查 / Ch. 7 Pull Requests and Code Review"
        - "第 8 章 分支策略與版本發布 / Ch. 8 Branching Strategies and Releases"
        - "第 9 章 後悔藥 / Ch. 9 Undoing Things"
        - "第 10 章 好習慣 / Ch. 10 Good Habits"
        - "附錄 A 術語總表 / Appendix A Glossary"
        - "附錄 B 現場行話 / Appendix B Team Jargon"
        - "附錄 C 指令與 Sourcetree 對照表 / Appendix C Commands and Sourcetree"
        - "附錄 D 延伸閱讀 / Appendix D Further Reading"
        - "練習專案 / Practice project"
        - "README 或其他專案文件 / README or other project documents"
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: 原文 / Original text
      description: 請貼上有問題的句子 / Paste the sentence that has the problem
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建議的修改 / Suggested correction
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 依據或參考資料 / References
      description: 例如官方文件、書籍或實際執行的結果 / e.g. official documentation, books or the output you actually got
  - type: checkboxes
    id: confidentiality
    attributes:
      label: 確認 / Confirmation
      options:
        - label: 我提供的內容不包含任何機密資訊、密碼或金鑰 / My report contains no confidential information, passwords or keys
          required: true
